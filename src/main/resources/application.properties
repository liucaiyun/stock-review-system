# 独立 H2 文件库，无需安装 MySQL
spring.datasource.url=jdbc:h2:file:./data/stock-review;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2
spring.h2.console.settings.web-allow-others=false

server.port=8088
spring.jackson.time-zone=Asia/Shanghai
server.tomcat.threads.max=40
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=8

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 行情请求超时（毫秒）
stock.quote.connect-timeout-ms=4000
stock.quote.read-timeout-ms=6000

# XXL-Job：调度中心任务的 JobHandler 填 WatchPriceRefreshJob（与类名一致，大小写敏感）。
# 本机没有调度中心时改成 false，否则每 30 秒 Connection refused 刷屏。
xxl.job.enabled=true
xxl.job.admin.addresses=http://127.0.0.1:8080/xxl-job-admin
xxl.job.admin.accessToken=default_token
xxl.job.executor.appname=stock-review
xxl.job.executor.port=9999
xxl.job.executor.logpath=./data/xxl-job-logs
xxl.job.executor.logretentiondays=7
