# 独立 H2 文件库，无需安装 MySQL
spring.datasource.url=jdbc:h2:file:./data/stock-review;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2
spring.h2.console.settings.web-allow-others=false

server.port=8088
server.tomcat.threads.max=40
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=8

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 行情请求超时（毫秒）
stock.quote.connect-timeout-ms=4000
stock.quote.read-timeout-ms=6000
